<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Epic Fury Editor</title>
<meta name="description" content="The Epic Fury video editor on its own. Free for Mac, no account, works offline.">
<meta name="theme-color" content="#0a0e1c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/home.css?v=4">
<link rel="icon" href="/icon.png">
<style>
.ed{max-width:640px;margin:0 auto;padding:88px 0 64px;text-align:center}
.ed h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,6vw,56px);line-height:1.04;letter-spacing:-.03em;margin:0}
.ed .lede{margin:16px auto 28px}
.ed .go{font-size:16px;padding:13px 20px;text-decoration:none}
.ed .go[aria-disabled="true"]{opacity:.55;pointer-events:none}
.ed .specs{justify-content:center;margin-top:18px}
.ed small{display:block;margin-top:10px;color:var(--faint);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="mark" href="/"><img src="/icon-128.png" alt="">Epic Fury Studio</a>
    <nav><a href="/privacy">Privacy</a><a href="/terms">Terms</a></nav>
  </div>
</header>
<main class="page">
  <section class="ed">
    <h1>Epic Fury Editor</h1>
    <p class="lede">Make videos from your footage and songs, lyrics timed in. Free, no account, works offline.</p>
    <a class="go" id="dl" href="#" aria-disabled="true">
      <span id="dlLabel">Coming soon</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17.5H6.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.6 8a4 4 0 0 1-.1 9.5H17"/><path d="M12 11v9"/><path d="m8.5 16.5 3.5 3.5 3.5-3.5"/></svg>
    </a>
    <small id="dlSize"></small>
    <div class="specs">
      <span class="chip"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.8-3.5.8-.7 0-1.9-.8-3.1-.8-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.6s-2.4-1-2.4-3.6zM14.1 5.6c.6-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>Mac with Apple silicon</span>
    </div>
  </section>
</main>
<script>
/* The download is whatever /editor.json names: one file to change when a new DMG is up. */
(async () => {
  try {
    const r = await fetch('/editor.json', { cache: 'no-store' });
    const d = await r.json();
    if (!d || !/^https:\/\//.test(d.url || '')) return;
    const a = document.getElementById('dl');
    a.href = d.url;
    a.removeAttribute('aria-disabled');
    a.setAttribute('download', '');
    document.getElementById('dlLabel').textContent = 'Download';
    if (d.version || d.bytes) document.getElementById('dlSize').textContent =
      [d.version ? 'Version ' + d.version : '', d.bytes ? (d.bytes / 1e9).toFixed(1) + ' GB' : ''].filter(Boolean).join(' · ');
  } catch (_) {}
})();
</script>
</body>
</html>
