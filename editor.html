<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Industry Plant</title>
<meta name="description" content="The Industry Plant video editor for Mac. Free, no account, works offline.">
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#171717;--ink:#e7e7e7;--dim:#adadad;--line:rgba(231,231,231,.2);--lime:#b4de41}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(55% 45% at 92% -5%,rgba(31,54,30,.7),transparent 70%),radial-gradient(45% 40% at -5% 105%,rgba(255,77,0,.13),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.5 Inter,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ed{max-width:640px;margin:0 auto;padding:18vh 16px 64px;text-align:center}
.ed h1{font-weight:800;font-size:clamp(40px,7vw,64px);line-height:1.02;letter-spacing:-.03em;margin:0}
.ed .lede{margin:16px auto 32px;color:var(--dim);max-width:30em}
.go{display:inline-flex;align-items:center;gap:10px;font:600 16px Inter,sans-serif;padding:13px 24px;border-radius:999px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);text-decoration:none;transition:transform .15s,background .15s}
.go:hover{transform:translateY(-2px)}
.go svg{width:20px;height:20px}
.go[aria-disabled="true"]{background:transparent;color:var(--ink);opacity:.6;pointer-events:none}
.ed small{display:block;margin-top:12px;color:var(--dim);font-size:13px;min-height:1.2em}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:18px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--dim)}
.chip svg{width:14px;height:14px}
</style>
</head>
<body>
<main>
  <section class="ed">
    <h1>Industry Plant</h1>
    <p class="lede">Make videos from your footage and songs, lyrics timed in. Free, no account, works offline.</p>
    <a class="go" id="dl" href="#" aria-disabled="true">
      <span id="dlLabel">Coming soon</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17.5H6.5a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 17.6 8a4 4 0 0 1-.1 9.5H17"/><path d="M12 11v9"/><path d="m8.5 16.5 3.5 3.5 3.5-3.5"/></svg>
    </a>
    <small id="dlSize"></small>
    <div>
      <span class="chip"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.4 2-3.5 2-3.6-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.8-3.5.8-.7 0-1.9-.8-3.1-.8-1.6 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.6s-2.4-1-2.4-3.6zM14.1 5.6c.6-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>Mac with Apple silicon</span>
    </div>
  </section>
</main>
<script>
/* The download is whatever /editor.json names: one file to change when a new DMG is up. */
(async () => {
  try {
    const r = await fetch('/editor.json', { cache: 'no-store' });
    const d = await r.json();
    if (!d || !/^https:\/\//.test(d.url || '')) return;
    const a = document.getElementById('dl');
    a.href = d.url;
    a.removeAttribute('aria-disabled');
    a.setAttribute('download', '');
    document.getElementById('dlLabel').textContent = 'Download';
    if (d.version || d.bytes) document.getElementById('dlSize').textContent =
      [d.version ? 'Version ' + d.version : '', d.bytes ? (d.bytes / 1e9).toFixed(1) + ' GB' : ''].filter(Boolean).join(' · ');
  } catch (_) {}
})();
</script>
</body>
</html>
